[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ms-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
ms-agent = "ms_agent.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["ms_agent"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
